<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Forge — Sentence Builder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --surface: rgba(255,255,255,0.06);
      --surface-h: rgba(255,255,255,0.1);
      --border: rgba(255,255,255,0.08);
      --border-h: rgba(255,255,255,0.18);
      --tx: #E2E8F0;
      --tx-2: #94A3B8;
      --tx-3: #64748B;
      --indigo: #6366F1;
      --coral: #F97066;
      --cyan: #22D3EE;
      --violet: #8B5CF6;
      --pink: #EC4899;
      --gold: #F59E0B;
      --green: #10B981;
      --font: 'Space Grotesk', sans-serif;
      --font-2: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-2);
      background: var(--bg);
      color: var(--tx);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* ===== ANIMATED MESH GRADIENT BG ===== */
    .mesh-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .mesh-bg .blob {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4;
    }
    .mesh-bg .blob-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.3), transparent 70%);
      top: -10%; left: -5%;
      animation: drift1 16s ease-in-out infinite alternate;
    }
    .mesh-bg .blob-2 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(249,112,102,0.25), transparent 70%);
      bottom: -10%; right: -5%;
      animation: drift2 14s ease-in-out infinite alternate;
    }
    .mesh-bg .blob-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(34,211,238,0.15), transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      animation: drift3 18s ease-in-out infinite alternate;
    }
    @keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(50px,-30px) scale(1.1)} 100%{transform:translate(-20px,40px) scale(0.95)} }
    @keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-40px,20px) scale(1.08)} 100%{transform:translate(30px,-30px) scale(0.92)} }
    @keyframes drift3 { 0%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-40%,-40%) scale(1.15)} 100%{transform:translate(-60%,-30%) scale(0.9)} }

    /* ===== MAIN CONTAINER ===== */
    .forge-container {
      position: relative; z-index: 1;
      width: 90%; max-width: 720px;
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }

    /* ===== HEADER ===== */
    .forge-header {
      text-align: center; opacity: 0; animation: fadeUp 0.6s 0.2s ease forwards;
    }
    .forge-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
      border-radius: 20px; padding: 4px 14px; font-size: 11px; font-weight: 600;
      color: var(--indigo); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    }
    .forge-title {
      font-family: var(--font); font-size: clamp(20px, 4vw, 28px); font-weight: 700;
      color: var(--tx); margin-bottom: 4px;
    }
    .forge-sub { font-size: 14px; color: var(--tx-2); }

    /* ===== WORD CARD ===== */
    .word-card {
      width: 100%; max-width: 480px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 32px;
      text-align: center; position: relative; overflow: hidden;
      opacity: 0; animation: fadeUp 0.6s 0.4s ease forwards;
    }
    .word-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit;
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(249,112,102,0.2), rgba(34,211,238,0.2));
      z-index: -1; opacity: 0.5;
    }
    .word-card .wc-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
      color: var(--tx-3); margin-bottom: 8px; font-weight: 600;
    }
    .word-card .wc-word {
      font-family: var(--font); font-size: clamp(32px, 6vw, 48px); font-weight: 700;
      background: linear-gradient(135deg, #6366F1, #F97066, #22D3EE);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.1; margin-bottom: 8px;
    }
    .word-card .wc-meaning {
      font-size: 15px; color: var(--tx-2); margin-bottom: 4px;
    }
    .word-card .wc-pos {
      display: inline-block; background: rgba(99,102,241,0.12); color: var(--indigo);
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .word-card .wc-example {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
      font-size: 13px; color: var(--tx-3); font-style: italic;
    }

    /* ===== DROP ZONE ===== */
    .drop-zone-wrapper {
      width: 100%; max-width: 560px;
      opacity: 0; animation: fadeUp 0.6s 0.6s ease forwards;
    }
    .drop-zone-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--tx-3); margin-bottom: 10px; font-weight: 600; text-align: center;
    }
    .drop-zone {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 8px;
      min-height: 64px; padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 16px;
      transition: all 0.3s ease;
      position: relative;
    }
    .drop-zone.active {
      border-color: var(--indigo);
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 30px rgba(99,102,241,0.15);
    }
    .drop-zone.correct {
      border-color: var(--green);
      background: rgba(16,185,129,0.08);
      box-shadow: 0 0 40px rgba(16,185,129,0.2);
      animation: correctPulse 0.5s ease;
    }
    .drop-zone.wrong {
      border-color: var(--coral);
      background: rgba(249,112,102,0.08);
      animation: shake 0.4s ease;
    }
    @keyframes correctPulse { 0%{transform:scale(1)} 50%{transform:scale(1.02)} 100%{transform:scale(1)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    .drop-zone .placeholder {
      color: var(--tx-3); font-size: 13px; user-select: none;
    }

    /* ===== WORD TILES ===== */
    .tiles-area {
      width: 100%; max-width: 560px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      opacity: 0; animation: fadeUp 0.6s 0.8s ease forwards;
    }
    .tile {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 20px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      color: var(--tx);
      cursor: grab; user-select: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      touch-action: none;
    }
    .tile::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(249,112,102,0.08));
      opacity: 0; transition: opacity 0.2s;
    }
    .tile:hover::before { opacity: 1; }
    .tile:hover {
      border-color: var(--border-h);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging {
      transform: scale(1.12);
      box-shadow: 0 8px 32px rgba(99,102,241,0.3);
      border-color: var(--indigo);
      z-index: 100;
      opacity: 0.92;
    }
    .tile.placed {
      background: rgba(99,102,241,0.15);
      border-color: rgba(99,102,241,0.4);
      color: var(--indigo);
      cursor: grab;
    }
    .tile.in-zone {
      animation: tileSnap 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes tileSnap { 0%{transform:scale(1.15);opacity:0.5} 100%{transform:scale(1);opacity:1} }

    /* ===== CONTROLS ===== */
    .forge-controls {
      display: flex; gap: 10px; opacity: 0; animation: fadeUp 0.6s 1s ease forwards;
    }
    .forge-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 12px;
      font-family: var(--font-2); font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.25s ease;
    }
    .forge-btn-check {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: #fff;
    }
    .forge-btn-check:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .forge-btn-check:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .forge-btn-reset {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--tx-2);
    }
    .forge-btn-reset:hover { border-color: var(--border-h); color: var(--tx); transform: translateY(-1px); }
    .forge-btn-next {
      background: linear-gradient(135deg, var(--green), #059669);
      color: #fff;
    }
    .forge-btn-next:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(16,185,129,0.4); }

    /* ===== SCORE ===== */
    .forge-score {
      display: flex; align-items: center; gap: 16px;
      opacity: 0; animation: fadeUp 0.6s 1.1s ease forwards;
    }
    .forge-score .fs-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--tx-2);
    }
    .forge-score .fs-val {
      font-family: var(--font); font-weight: 700; font-size: 18px;
    }
    .forge-score .fs-correct .fs-val { color: var(--green); }
    .forge-score .fs-streak .fs-val { color: var(--gold); }
    .forge-score .fs-total .fs-val { color: var(--tx); }

    /* ===== PROGRESS ===== */
    .forge-progress {
      width: 100%; max-width: 300px; height: 4px;
      background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden;
      opacity: 0; animation: fadeUp 0.6s 1.2s ease forwards;
    }
    .forge-progress .fp-fill {
      height: 100%; background: linear-gradient(90deg, var(--indigo), var(--coral), var(--cyan));
      border-radius: 2px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== SUCCESS BURST ===== */
    .success-burst {
      position: fixed; inset: 0; z-index: 1000; pointer-events: none;
    }
    .success-burst .conf {
      position: absolute; border-radius: 50%;
      animation: confBurst var(--d, 1.5s) ease-out forwards;
      animation-delay: var(--dd, 0s);
    }
    @keyframes confBurst {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="forge-container">
    <div class="forge-header">
      <div class="forge-badge"><i class="fas fa-hammer"></i> Word Forge</div>
      <div class="forge-title">Sentence Builder</div>
      <div class="forge-sub">Drag the tiles to form a correct sentence</div>
    </div>

    <div class="word-card" id="wordCard">
      <div class="wc-label">Word of the Day</div>
      <div class="wc-word" id="targetWord">Ubiquitous</div>
      <div class="wc-meaning" id="targetMeaning">Existing or being everywhere at the same time</div>
      <div class="wc-pos" id="targetPos">adjective</div>
      <div class="wc-example" id="targetExample">"Smartphones are now ubiquitous in modern society."</div>
    </div>

    <div class="drop-zone-wrapper">
      <div class="drop-zone-label">Build your sentence</div>
      <div class="drop-zone" id="dropZone">
        <span class="placeholder" id="placeholder">Drop words here to form a sentence...</span>
      </div>
    </div>

    <div class="tiles-area" id="tilesArea"></div>

    <div class="forge-controls">
      <button class="forge-btn forge-btn-reset" id="btnReset" onclick="resetSentence()"><i class="fas fa-redo"></i> Reset</button>
      <button class="forge-btn forge-btn-check" id="btnCheck" onclick="checkSentence()" disabled><i class="fas fa-check"></i> Check</button>
      <button class="forge-btn forge-btn-next" id="btnNext" onclick="nextWord()" style="display:none"><i class="fas fa-arrow-right"></i> Next</button>
    </div>

    <div class="forge-score">
      <div class="fs-item fs-correct"><i class="fas fa-check-circle"></i> <span class="fs-val" id="scoreCorrect">0</span></div>
      <div class="fs-item fs-streak"><i class="fas fa-fire"></i> <span class="fs-val" id="scoreStreak">0</span> streak</div>
      <div class="fs-item fs-total"><i class="fas fa-list"></i> <span class="fs-val" id="scoreTotal">1/10</span></div>
    </div>

    <div class="forge-progress"><div class="fp-fill" id="progressFill" style="width:10%"></div></div>
  </div>

  <div class="success-burst" id="burstContainer"></div>

  <script>
    // ===== WORD DATA =====
    const WORDS = [
      { word: "Ubiquitous", meaning: "Existing or being everywhere at the same time", pos: "adjective", example: "Smartphones are now ubiquitous in modern society.", sentence: ["Smartphones", "are", "now", "ubiquitous", "in", "modern", "society"], tiles: ["Smartphones", "are", "now", "ubiquitous", "in", "modern", "society", "the", "has"] },
      { word: "Ephemeral", meaning: "Lasting for a very short time", pos: "adjective", example: "The beauty of cherry blossoms is ephemeral.", sentence: ["The", "beauty", "of", "cherry", "blossoms", "is", "ephemeral"], tiles: ["The", "beauty", "of", "cherry", "blossoms", "is", "ephemeral", "are", "was"] },
      { word: "Resilient", meaning: "Able to recover quickly from difficulties", pos: "adjective", example: "Children are remarkably resilient after setbacks.", sentence: ["Children", "are", "remarkably", "resilient", "after", "setbacks"], tiles: ["Children", "are", "remarkably", "resilient", "after", "setbacks", "is", "the"] },
      { word: "Meticulous", meaning: "Showing great attention to detail", pos: "adjective", example: "She is meticulous about her research methodology.", sentence: ["She", "is", "meticulous", "about", "her", "research", "methodology"], tiles: ["She", "is", "meticulous", "about", "her", "research", "methodology", "are", "has"] },
      { word: "Pragmatic", meaning: "Dealing with things in a practical way", pos: "adjective", example: "We need a pragmatic approach to solve this problem.", sentence: ["We", "need", "a", "pragmatic", "approach", "to", "solve", "this", "problem"], tiles: ["We", "need", "a", "pragmatic", "approach", "to", "solve", "this", "problem", "the"] },
      { word: "Ambiguous", meaning: "Open to more than one interpretation", pos: "adjective", example: "The instructions were ambiguous and confusing.", sentence: ["The", "instructions", "were", "ambiguous", "and", "confusing"], tiles: ["The", "instructions", "were", "ambiguous", "and", "confusing", "is", "has"] },
      { word: "Lucrative", meaning: "Producing a great deal of profit", pos: "adjective", example: "Online businesses can be incredibly lucrative.", sentence: ["Online", "businesses", "can", "be", "incredibly", "lucrative"], tiles: ["Online", "businesses", "can", "be", "incredibly", "lucrative", "are", "the"] },
      { word: "Empathy", meaning: "The ability to understand others' feelings", pos: "noun", example: "Empathy is essential for building strong relationships.", sentence: ["Empathy", "is", "essential", "for", "building", "strong", "relationships"], tiles: ["Empathy", "is", "essential", "for", "building", "strong", "relationships", "are", "has"] },
      { word: "Tenacious", meaning: "Holding firmly to something; persistent", pos: "adjective", example: "Her tenacious spirit helped her overcome all obstacles.", sentence: ["Her", "tenacious", "spirit", "helped", "her", "overcome", "all", "obstacles"], tiles: ["Her", "tenacious", "spirit", "helped", "her", "overcome", "all", "obstacles", "the", "is"] },
      { word: "Catalyst", meaning: "A person or thing that causes change", pos: "noun", example: "Education acts as a catalyst for social progress.", sentence: ["Education", "acts", "as", "a", "catalyst", "for", "social", "progress"], tiles: ["Education", "acts", "as", "a", "catalyst", "for", "social", "progress", "the", "is"] }
    ];

    let currentIdx = 0, score = 0, streak = 0, placed = [], dragTile = null;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function loadWord(idx) {
      const w = WORDS[idx];
      document.getElementById('targetWord').textContent = w.word;
      document.getElementById('targetMeaning').textContent = w.meaning;
      document.getElementById('targetPos').textContent = w.pos;
      document.getElementById('targetExample').textContent = `"${w.example}"`;
      document.getElementById('scoreTotal').textContent = `${idx + 1}/${WORDS.length}`;
      document.getElementById('progressFill').style.width = `${((idx + 1) / WORDS.length) * 100}%`;

      placed = [];
      const zone = document.getElementById('dropZone');
      zone.innerHTML = '<span class="placeholder" id="placeholder">Drop words here to form a sentence...</span>';
      zone.classList.remove('active', 'correct', 'wrong');

      document.getElementById('btnCheck').disabled = true;
      document.getElementById('btnCheck').style.display = '';
      document.getElementById('btnNext').style.display = 'none';

      const tilesArea = document.getElementById('tilesArea');
      tilesArea.innerHTML = '';
      const shuffled = shuffle(w.tiles);
      shuffled.forEach((t, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = t;
        tile.dataset.word = t;
        tile.style.opacity = '0';
        tile.style.transform = 'translateY(20px) scale(0.8)';
        setTimeout(() => {
          tile.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
          tile.style.opacity = '1';
          tile.style.transform = 'translateY(0) scale(1)';
        }, 900 + i * 70);
        setupDrag(tile);
        tilesArea.appendChild(tile);
      });
    }

    function setupDrag(tile) {
      let startX, startY, origX, origY, isDragging = false, ghost = null;

      const onStart = (e) => {
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX; startY = touch.clientY;
        const rect = tile.getBoundingClientRect();
        origX = rect.left; origY = rect.top;
        isDragging = false;

        ghost = tile.cloneNode(true);
        ghost.style.position = 'fixed';
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        ghost.style.width = rect.width + 'px';
        ghost.style.zIndex = '1000';
        ghost.style.pointerEvents = 'none';
        ghost.style.transition = 'none';
        ghost.style.transform = 'scale(1.12)';
        ghost.style.boxShadow = '0 8px 32px rgba(99,102,241,0.35)';
        ghost.style.borderColor = '#6366F1';
        ghost.classList.add('dragging');
        document.body.appendChild(ghost);

        tile.style.opacity = '0.3';
        dragTile = tile;

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      };

      const onMove = (e) => {
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
        if (ghost) {
          ghost.style.left = (origX + dx) + 'px';
          ghost.style.top = (origY + dy) + 'px';
        }
        const zone = document.getElementById('dropZone');
        const zr = zone.getBoundingClientRect();
        const over = touch.clientX >= zr.left && touch.clientX <= zr.right && touch.clientY >= zr.top && touch.clientY <= zr.bottom;
        zone.classList.toggle('active', over);
      };

      const onEnd = (e) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);

        if (ghost) ghost.remove();
        tile.style.opacity = '1';

        if (isDragging) {
          const touch = e.changedTouches ? e.changedTouches[0] : e;
          const zone = document.getElementById('dropZone');
          const zr = zone.getBoundingClientRect();
          const over = touch.clientX >= zr.left && touch.clientX <= zr.right && touch.clientY >= zr.top && touch.clientY <= zr.bottom;

          if (over && !placed.includes(tile.dataset.word)) {
            placed.push(tile.dataset.word);
            tile.classList.add('placed');
            const zoneTile = document.createElement('div');
            zoneTile.className = 'tile in-zone placed';
            zoneTile.textContent = tile.dataset.word;
            zoneTile.dataset.word = tile.dataset.word;
            zoneTile.onclick = () => removeFromZone(zoneTile, tile);
            const ph = document.getElementById('placeholder');
            if (ph) ph.remove();
            zone.appendChild(zoneTile);
            document.getElementById('btnCheck').disabled = placed.length === 0;
          }
          zone.classList.remove('active');
        }
        dragTile = null;
      };

      tile.addEventListener('mousedown', onStart);
      tile.addEventListener('touchstart', onStart, { passive: false });
    }

    function removeFromZone(zoneTile, origTile) {
      const word = zoneTile.dataset.word;
      placed = placed.filter(w => w !== word);
      zoneTile.remove();
      if (origTile) { origTile.classList.remove('placed'); origTile.style.opacity = '1'; }
      const zone = document.getElementById('dropZone');
      if (!zone.querySelector('.tile')) {
        zone.innerHTML = '<span class="placeholder" id="placeholder">Drop words here to form a sentence...</span>';
      }
      document.getElementById('btnCheck').disabled = placed.length === 0;
    }

    function checkSentence() {
      const w = WORDS[currentIdx];
      const correct = w.sentence.join(' ');
      const attempt = placed.join(' ');
      const zone = document.getElementById('dropZone');

      if (attempt === correct) {
        zone.classList.add('correct');
        score++;
        streak++;
        document.getElementById('scoreCorrect').textContent = score;
        document.getElementById('scoreStreak').textContent = streak;
        createBurst();
        document.getElementById('btnCheck').style.display = 'none';
        document.getElementById('btnNext').style.display = '';
      } else {
        zone.classList.add('wrong');
        streak = 0;
        document.getElementById('scoreStreak').textContent = streak;
        setTimeout(() => zone.classList.remove('wrong'), 500);
      }
    }

    function resetSentence() {
      placed = [];
      const zone = document.getElementById('dropZone');
      zone.innerHTML = '<span class="placeholder" id="placeholder">Drop words here to form a sentence...</span>';
      zone.classList.remove('active', 'correct', 'wrong');
      document.querySelectorAll('#tilesArea .tile').forEach(t => { t.classList.remove('placed'); t.style.opacity = '1'; });
      document.getElementById('btnCheck').disabled = true;
    }

    function nextWord() {
      currentIdx = (currentIdx + 1) % WORDS.length;
      loadWord(currentIdx);
    }

    function createBurst() {
      const c = document.getElementById('burstContainer');
      const colors = ['#6366F1', '#F97066', '#22D3EE', '#10B981', '#F59E0B', '#EC4899'];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'conf';
        const angle = (Math.PI * 2 * i) / 40;
        const dist = 80 + Math.random() * 120;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        el.style.cssText = `left:50%;top:50%;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;background:${colors[i%colors.length]};--tx:${tx}px;--ty:${ty}px;--d:${0.8+Math.random()*0.7}s;--dd:${Math.random()*0.15}s`;
        c.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }
    }

    loadWord(0);
  </script>
</body>
</html>
