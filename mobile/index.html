<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BAC English Mobile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#080B1A;--card:rgba(12,16,35,.7);--surface:#0D1124;--border:rgba(255,255,255,.06);--text:#E8F0FF;--muted:#8892C0;--dark:#5A6080;--cyan:#00E5FF;--violet:#7C3AED;--pink:#FF6B9D;--gold:#FFD93D;--grad:linear-gradient(135deg,#00E5FF,#7C3AED);--font:'Inter',sans-serif;--heading:'Plus Jakarta Sans',sans-serif;--safe:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#EDF0F8;--card:rgba(255,255,255,.7);--surface:#FFF;--border:rgba(0,0,0,.08);--text:#1A1D2E;--muted:#6A7090;--dark:#8A90A8;--cyan:#0099CC;--violet:#6D28D9;--pink:#E04070;--gold:#CC9900}
html,body{height:100%;margin:0;overflow:hidden}body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{box-sizing:border-box;margin:0;padding:0}
input,button{font-family:var(--font);font-size:16px}
a{color:var(--cyan);text-decoration:none}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border);z-index:100;gap:8px}
.header .h-title{font-family:var(--heading);font-size:16px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header .h-title i{color:var(--gold);margin-right:6px}
.h-btn{background:none;border:none;color:var(--muted);font-size:18px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .2s;flex-shrink:0}
.h-btn:hover{color:var(--cyan)}

/* CONTENT */
.content{position:fixed;top:52px;left:0;right:0;bottom:56px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px}
.content:focus{outline:none}

/* BOTTOM TABS */
.tabs{position:fixed;bottom:0;left:0;right:0;height:56px;padding-bottom:var(--safe);display:flex;background:var(--bg);border-top:1px solid var(--border);z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer;transition:color .2s;padding:6px 0;border:none;background:none;-webkit-tap-highlight-color:transparent}
.tab i{font-size:20px}
.tab.active{color:var(--cyan)}
.tab.active i{text-shadow:0 0 10px rgba(0,229,255,.4)}

/* DASHBOARD */
.db-hero{text-align:center;padding:20px 10px 10px}
.db-hero .db-icon{font-size:44px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.db-hero h1{font-family:var(--heading);font-size:22px;font-weight:800;background:linear-gradient(135deg,#E8F0FF,#7C3AED,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:4px 0}
.db-hero .db-sub{font-size:12px;color:var(--muted)}
.db-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.db-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.db-stat .ds-num{font-size:22px;font-weight:800;color:var(--cyan);display:block}
.db-stat .ds-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.db-stat.violet .ds-num{color:var(--violet)}
.db-stat.gold .ds-num{color:var(--gold)}
.continue-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.continue-card:active{border-color:var(--cyan)}
.continue-card .cc-icon{font-size:28px;color:var(--cyan)}
.continue-card .cc-info{flex:1}
.continue-card .cc-label{font-size:11px;color:var(--muted)}
.continue-card .cc-title{font-weight:600;font-size:14px}
.continue-card .cc-arrow{color:var(--muted)}
.db-section-title{font-family:var(--heading);font-size:15px;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.db-section-title i{color:var(--gold)}

/* CHAPTER CARDS */
.chapter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .2s}
.ch-card:active{border-color:var(--cyan)}
.ch-card .ch-icon{font-size:24px;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ch-card .ch-name{font-weight:600;font-size:13px}
.ch-card .ch-count{font-size:11px;color:var(--muted);margin-top:2px}
.ch-card .ch-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:8px;overflow:hidden}
.ch-card .ch-fill{height:100%;width:0%;background:var(--grad);border-radius:2px;transition:width .5s}

/* CHAPTER MODULE */
.chapter-header{text-align:center;padding:16px 0 12px}
.chapter-header h2{font-family:var(--heading);font-size:20px;font-weight:700}
.chapter-header .ch-sub{font-size:12px;color:var(--muted);margin-top:4px}
.chapter-header .ch-progress{max-width:260px;margin:10px auto 0;display:flex;align-items:center;gap:10px}
.chapter-header .ch-bar2{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.chapter-header .ch-fill2{height:100%;width:0%;background:var(--grad);border-radius:3px;transition:width .5s}
.chapter-header .ch-pct{font-size:12px;font-weight:700;color:var(--cyan)}
.lesson-list{display:flex;flex-direction:column;gap:6px}
.lesson-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:border-color .2s}
.lesson-item:active{border-color:var(--cyan)}
.lesson-item .li-status{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0;transition:all .3s}
.lesson-item .li-status.done{border-color:var(--cyan);background:rgba(0,229,255,.15);color:var(--cyan)}
.lesson-item .li-info{flex:1;min-width:0}
.lesson-item .li-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-item .li-meta{font-size:11px;color:var(--muted)}
.lesson-item .li-arrow{color:var(--dark);font-size:12px}

/* READER */
.reader{padding-bottom:16px}
.reader h2{font-family:var(--heading);font-size:20px;font-weight:700;margin:16px 0 8px}
.reader h3{font-size:16px;font-weight:700;margin:14px 0 6px;color:var(--cyan)}
.reader p{margin:8px 0;line-height:1.7;font-size:14px}
.reader strong{color:var(--gold)}
.reader ul,ol{padding-left:20px;margin:8px 0}
.reader li{margin:6px 0;line-height:1.6;font-size:14px}
.reader del{color:var(--pink);text-decoration:line-through}
.reader table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.reader th{background:rgba(0,229,255,.08);color:var(--cyan);font-weight:700;padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.reader td{padding:10px 12px;border-bottom:1px solid var(--border)}
.reader tr:last-child td{border-bottom:none}
.reader .bridge-box{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);border-left:4px solid var(--cyan);border-radius:10px;padding:14px;margin:12px 0}
.reader .bridge-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--cyan);margin-bottom:6px}
.reader .bridge-box p{margin:4px 0;font-size:13px;line-height:1.6}
.reader .example-box{background:rgba(255,217,61,.06);border:1px solid rgba(255,217,61,.2);border-left:4px solid var(--gold);border-radius:10px;padding:14px;margin:12px 0}
.reader .example-box p{margin:4px 0;font-size:13px}
.reader .exam-tip{background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(0,229,255,.05));border:1px solid rgba(124,58,237,.2);border-radius:10px;padding:12px;margin:12px 0;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.reader .exam-tip i{color:var(--violet);font-size:16px;margin-top:1px}
.reader .code-block{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:12px;line-height:1.7;overflow-x:auto;margin:10px 0}
.reader .introduction p{margin:4px 0;line-height:1.7}
.reader .introduction p:last-child{color:var(--muted);font-style:italic;font-size:13px}

/* ACCORDION MOBILE */
.acc-item{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.acc-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--cyan);user-select:none;-webkit-tap-highlight-color:transparent}
.acc-header:active{background:rgba(0,229,255,.05)}
.acc-header i{transition:transform .3s;font-size:12px;color:var(--muted)}
.acc-item.open .acc-header i{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-body>*{padding:0 14px 12px}
.acc-body p,.acc-body pre{margin:6px 0;font-size:13px;line-height:1.6}

/* FLASHCARDS MOBILE */
.fc-wrap{max-width:300px;margin:2rem auto;text-align:center}
.fc-count{font-size:13px;color:var(--muted);margin-bottom:10px}
.fc-card-wrap{perspective:1000px;margin-bottom:16px;cursor:pointer}
.fc-card{position:relative;width:100%;height:190px;transition:transform .5s;transform-style:preserve-3d;border-radius:12px}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:12px;padding:20px}
.fc-front{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#fff;font-size:36px;font-weight:800;font-family:var(--heading)}
.fc-back{background:var(--surface);border:1px solid var(--border);transform:rotateY(180deg);gap:6px}
.fc-back-row{font-size:16px}
.fc-back-row strong{color:var(--gold)}
.fc-nav{display:flex;gap:8px;justify-content:center}
.fc-btn{padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s;-webkit-tap-highlight-color:transparent}
.fc-btn:active{border-color:var(--cyan);background:rgba(0,229,255,.08)}
.fc-flip-btn{background:var(--grad);color:#fff;border:none}
.fc-flip-btn:active{opacity:.85}

/* QUIZ MOBILE */
.quiz-q{font-size:16px;font-weight:600;text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;transition:all .2s;-webkit-tap-highlight-color:transparent}
.quiz-opt:active{border-color:var(--cyan)}
.quiz-opt.correct{background:rgba(0,229,255,.15);border-color:var(--cyan)}
.quiz-opt.wrong{background:rgba(255,107,157,.15);border-color:var(--pink)}
.quiz-fb{display:none;padding:12px;border-radius:8px;margin-top:12px;font-weight:600;text-align:center;font-size:14px}
.quiz-fb.show{display:block;background:rgba(0,229,255,.1);border:1px solid var(--cyan)}
.quiz-score{font-size:32px;font-weight:800;text-align:center;color:var(--gold);padding:30px}
.quiz-nav{text-align:center;margin-top:14px}
.quiz-btn{padding:12px 24px;background:var(--grad);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.quiz-btn:active{opacity:.85}

/* SECTION FOOTER */
.sf-nav{display:flex;gap:8px;margin:20px 0}
.sf-btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:center;transition:border-color .2s}
.sf-btn:active{border-color:var(--cyan)}
.sf-btn .sf-dir{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sf-btn .sf-tit{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-btn.sf-next .sf-tit{color:var(--cyan)}
.sf-complete-row{margin:16px 0;text-align:center}
.sf-complete{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:14px;transition:all .3s}
.sf-complete:active{border-color:var(--cyan)}
.sf-complete.done{border-color:var(--cyan);background:rgba(0,229,255,.1)}
.sf-complete.done i{color:var(--cyan)}

/* SEARCH OVERLAY */
.search-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.search-overlay.open{display:flex}
.search-header{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);gap:8px}
.search-header input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:16px}
.search-header input::placeholder{color:var(--muted)}
.search-results{flex:1;overflow-y:auto;padding:8px 12px}
.search-item{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px}
.search-item:active{background:var(--card)}
.search-item .si-chapter{font-size:11px;color:var(--muted)}
.search-item .si-title{font-weight:500;margin-top:2px}

/* TOAST */
.toast-container{position:fixed;top:60px;left:12px;right:12px;z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:13px;display:flex;align-items:center;gap:8px;pointer-events:auto;animation:slideDown .3s ease}
.toast.removing{animation:slideUp .25s ease forwards}
.toast-success{border-color:var(--cyan);background:rgba(0,229,255,.1)}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}

/* PROGRESS TAB */
.progress-grid{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.progress-chapter{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.progress-chapter .pc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-chapter .pc-name{font-weight:600;font-size:14px}
.progress-chapter .pc-num{font-size:12px;color:var(--muted)}
.progress-chapter .pc-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.progress-chapter .pc-fill{height:100%;width:0%;background:var(--grad);border-radius:2px;transition:width .5s}

/* BOOT */
.boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.boot.hidden{opacity:0;pointer-events:none}
.boot-inner{text-align:center}
.boot-icon{font-size:56px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulse 2s ease-in-out infinite}
.boot-name{font-family:var(--heading);font-size:24px;font-weight:800;margin-top:8px}
.boot-bar{width:200px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin:20px auto 0;overflow:hidden}
.boot-fill{height:100%;width:0%;background:var(--grad);border-radius:2px;transition:width .3s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* MISC */
.hidden{display:none!important}
.section-title{margin-bottom:4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.reader .true-label{color:#00E676;font-weight:700}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-inner"><div class="boot-icon"><i class="fas fa-feather-alt"></i></div><div class="boot-name">BAC ENGLISH</div><div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div></div></div>

<div class="header">
<button class="h-btn" id="btnBack" onclick="goBack()" style="display:none"><i class="fas fa-arrow-left"></i></button>
<div class="h-title" id="headerTitle"><i class="fas fa-graduation-cap"></i> BAC English</div>
<button class="h-btn" onclick="toggleTheme()" id="btnTheme"><i class="fas fa-moon"></i></button>
<button class="h-btn" onclick="openSearch()"><i class="fas fa-search"></i></button>
</div>

<div class="content" id="content"></div>

<div class="tabs" id="tabs">
<button class="tab active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-home"></i>Home</button>
<button class="tab" data-tab="chapters" onclick="switchTab('chapters')"><i class="fas fa-list"></i>Chapters</button>
<button class="tab" data-tab="progress" onclick="switchTab('progress')"><i class="fas fa-chart-simple"></i>Progress</button>
</div>

<div class="search-overlay" id="searchOverlay">
<div class="search-header"><input type="text" id="searchInput" placeholder="Search lessons..." oninput="doSearch(this.value)" autofocus><button class="h-btn" onclick="closeSearch()"><i class="fas fa-times"></i></button></div>
<div class="search-results" id="searchResults"></div>
</div>

<div id="toastCon" class="toast-container"></div>

{id:"strategy",type:"section",title:"BAC Exam Strategy",parent:"strategy-chapter"},
{id:"mistakes",type:"section",title:"20 Common Mistakes",parent:"strategy-chapter"},
{id:"study-plan",type:"section",title:"10-Day Study Plan",parent:"strategy-chapter"},
{id:"quiz",type:"section",title:"Practice Quiz",parent:"strategy-chapter"},
{id:"exams",type:"chapter",title:"National Exams",icon:"fa-file-alt"},
{id:"corrections",type:"section",title:"Answer Keys & Corrections",parent:"exams"},
{id:"national-exams",type:"section",title:"National Exam Samples",parent:"exams"},
{id:"bonus",type:"chapter",title:"Bonus (إضافات)",icon:"fa-gem"},
{id:"proverbs",type:"section",title:"Proverbs, Slang & More",parent:"bonus"},
];
const CHAPTERS = SECTIONS.filter(s=>s.type==="chapter");
const CHAPTER_IDS = CHAPTERS.map(s=>s.id);
const getSections=(ch)=>SECTIONS.filter(s=>s.parent===ch);
const getTitle=(id)=>{const s=SECTIONS.find(x=>x.id===id);return s?s.title:""};
const getParent=(id)=>{const s=SECTIONS.find(x=>x.id===id);return s?s.parent:null};

// ===== STATE =====
let contentHtml = "";
let currentId = null;
let currentTab = "home";
let theme = localStorage.getItem("m_theme")||"dark";
function getComp(){try{return JSON.parse(localStorage.getItem("m_comp")||"[]")}catch(e){return[]}}
function setComp(l){localStorage.setItem("m_comp",JSON.stringify(l))}
function isComp(id){return getComp().includes(id)}
function toggleComp(id){let l=getComp();if(l.includes(id))l=l.filter(x=>x!==id);else l.push(id);setComp(l);return l.includes(id)}
function chCount(ch){const s=getSections(ch);const c=getComp();return s.filter(x=>c.includes(x.id)).length}
function chPct(ch){const s=getSections(ch);return s.length?Math.round((chCount(ch)/s.length)*100):0}
function nextId(id){const s=SECTIONS.find(x=>x.id===id);if(!s||!s.parent)return null;const ss=getSections(s.parent);const i=ss.findIndex(x=>x.id===id);if(i>=0&&i<ss.length-1)return ss[i+1].id;return null}
function prevId(id){const s=SECTIONS.find(x=>x.id===id);if(!s||!s.parent)return null;const ss=getSections(s.parent);const i=ss.findIndex(x=>x.id===id);if(i>0)return ss[i-1].id;return null}

// ===== BOOT =====
(function(){const f=document.getElementById("bootFill");let p=0;const iv=setInterval(()=>{p+=Math.random()*22+8;if(p>100)p=100;f.style.width=p+"%";if(p>=100){clearInterval(iv);setTimeout(()=>{document.getElementById("boot").classList.add("hidden");init();},300)}},100)})();

function init(){
  if(theme==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("btnTheme").innerHTML='<i class="fas fa-sun"></i>'}
  document.documentElement.style.setProperty("--safe","env(safe-area-inset-bottom,0px)");
  loadContent();
}

// ===== LOAD =====
async function loadContent(){
  try{
    const r=await fetch("bac-english-complete.html");
    contentHtml=await r.text();
    contentHtml=contentHtml.replace(/<script[\s\S]*?<\/script>/gi,"");
    switchTab("home");
  }catch(e){
    document.getElementById("content").innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--muted)"><i class="fas fa-exclamation-triangle" style="font-size:40px;margin-bottom:12px;color:var(--gold)"></i><p>Could not load guide content.</p><p style="font-size:13px;margin-top:8px">Make sure <strong>bac-english-complete.html</strong> is in the same folder.</p></div>`;
  }
}

// ===== SWIPE =====
(function(){
  let sx=0,sy=0,dx=0,dy=0,swiping=false,startEl=null;
  const el=document.getElementById("content");
  el.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;dx=0;dy=0;swiping=true;startEl=e.target;},{passive:true});
  el.addEventListener("touchmove",e=>{if(!swiping)return;const t=e.changedTouches[0];dx=t.clientX-sx;dy=t.clientY-sy;},{passive:true});
  el.addEventListener("touchend",e=>{if(!swiping)return;swiping=false;if(Math.abs(dx)<30||Math.abs(dy)>Math.abs(dx)*1.5)return;const n=dx<0?nextId(currentId):prevId(currentId);if(n)showSection(n);},{passive:true});
})();

// ===== TABS =====
function switchTab(tab){
  currentTab=tab;
  currentId=null;
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.tab===tab));
  const back=document.getElementById("btnBack");
  back.style.display="none";
  document.getElementById("headerTitle").innerHTML='<i class="fas fa-graduation-cap"></i> BAC English';
  if(tab==="home")showDashboard();
  else if(tab==="chapters")showChapterList();
  else if(tab==="progress")showProgress();
}
function selectTab(tab){switchTab(tab)}

// ===== DASHBOARD =====
function showDashboard(){
  const ss=SECTIONS.filter(s=>s.type==="section");
  const total=ss.length;
  const done=getComp().length;
  const last=localStorage.getItem("m_last");
  let cont="";
  if(last){
    const ls=SECTIONS.find(x=>x.id===last);
    if(ls&&ls.parent){
      const pt=CHAPTERS.find(x=>x.id===ls.parent);
      cont=`<div class="continue-card" onclick="showSection('${ls.id}')">
        <div class="cc-icon"><i class="fas fa-play-circle"></i></div>
        <div class="cc-info">
          <div class="cc-label">Continue</div>
          <div class="cc-title">${ls.title}</div>
        </div>
        <div class="cc-arrow"><i class="fas fa-chevron-right"></i></div>
      </div>`;
    }
  }
  document.getElementById("content").innerHTML=`
    <div class="db-hero">
      <div class="db-icon"><i class="fas fa-graduation-cap"></i></div>
      <h1>BAC ENGLISH</h1>
      <div class="db-sub">Complete Study Guide</div>
    </div>
    <div class="db-stats">
      <div class="db-stat"><span class="ds-num">${total}</span><span class="ds-lbl">Lessons</span></div>
      <div class="db-stat violet"><span class="ds-num">${done}/${total}</span><span class="ds-lbl">Completed</span></div>
    </div>
    ${cont}
    <div class="db-section-title"><i class="fas fa-book-open"></i> Chapters</div>
    <div class="chapter-grid">${CHAPTERS.map(s=>{
      const pct=chPct(s.id);
      return `<div class="ch-card" onclick="showChapter('${s.id}')">
        <div class="ch-icon"><i class="fas ${s.icon}"></i></div>
        <div class="ch-name">${s.title}</div>
        <div class="ch-count">${chCount(s.id)}/${getSections(s.id).length}</div>
        <div class="ch-bar"><div class="ch-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join("")}</div>`;
}

// ===== CHAPTER LIST =====
function showChapterList(){
  document.getElementById("content").innerHTML=`
    <div style="margin-bottom:12px"><div class="section-title">All Chapters</div></div>
    <div class="chapter-grid">${CHAPTERS.map(s=>{
      const pct=chPct(s.id);
      return `<div class="ch-card" onclick="showChapter('${s.id}')">
        <div class="ch-icon"><i class="fas ${s.icon}"></i></div>
        <div class="ch-name">${s.title}</div>
        <div class="ch-count">${chCount(s.id)}/${getSections(s.id).length}</div>
        <div class="ch-bar"><div class="ch-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join("")}</div>`;
}

// ===== CHAPTER =====
function showChapter(id){
  currentId=id;
  localStorage.setItem("m_last",id);
  const ch=CHAPTERS.find(x=>x.id===id);
  const ss=getSections(id);
  const d=chCount(id);
  const t=ss.length;
  const p=chPct(id);
  document.getElementById("btnBack").style.display="flex";
  document.getElementById("headerTitle").innerHTML=ch?ch.title:"Chapter";
  document.getElementById("content").innerHTML=`
    <div class="chapter-header">
      <h2>${ch?ch.title:""}</h2>
      <div class="ch-sub">${t} lessons &middot; ${d} completed</div>
      <div class="ch-progress">
        <div class="ch-bar2"><div class="ch-fill2" style="width:${p}%"></div></div>
        <span class="ch-pct">${p}%</span>
      </div>
    </div>
    <div class="lesson-list">${ss.map(x=>{
      const c=isComp(x.id);
      return `<div class="lesson-item" onclick="showSection('${x.id}')">
        <div class="li-status ${c?'done':''}">${c?'<i class="fas fa-check"></i>':''}</div>
        <div class="li-info"><div class="li-title">${x.title}</div><div class="li-meta">${c?'Completed':'Click to start'}</div></div>
        <div class="li-arrow"><i class="fas fa-chevron-right"></i></div>
      </div>`;
    }).join("")}</div>`;
}

// ===== SHOW SECTION =====
function showSection(id){
  currentId=id;
  localStorage.setItem("m_last",id);
  if(CHAPTER_IDS.includes(id)){showChapter(id);return}
  const s=SECTIONS.find(x=>x.id===id);
  const html=extractSection(id);
  if(!html){document.getElementById("content").innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)"><i class="fas fa-file" style="font-size:32px;margin-bottom:8px"></i><p>Section not found.</p></div>`;return}
  const pt=s&&s.parent?CHAPTERS.find(x=>x.id===s.parent)?.title:"";
  document.getElementById("btnBack").style.display="flex";
  document.getElementById("headerTitle").innerHTML=s?s.title:"";
  const c=isComp(id);
  const n=nextId(id);
  const p=prevId(id);
  document.getElementById("content").innerHTML=`
    <div class="reader">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px"><i class="fas fa-book"></i> ${pt||""}</div>
      <h2>${s?s.title:""}</h2>
      ${html}
      <div class="sf-nav">
        ${p?`<div class="sf-btn" onclick="showSection('${p}')"><div class="sf-dir">Previous</div><div class="sf-tit">${getTitle(p)}</div></div>`:''}
        ${n?`<div class="sf-btn sf-next" onclick="showSection('${n}')"><div class="sf-dir">Next</div><div class="sf-tit">${getTitle(n)}</div></div>`:''}
      </div>
      <div class="sf-complete-row">
        <div class="sf-complete ${c?'done':''}" onclick="markComp('${id}')">
          <i class="fas ${c?'fa-check-circle':'fa-circle'}"></i>
          <span>${c?'Completed':'Mark Complete'}</span>
        </div>
      </div>
    </div>`;
  document.getElementById("content").scrollTop=0;
}

function extractSection(id){
  if(!contentHtml)return null;
  const r=new RegExp(`<div[^>]*id=["']page-${id}["'][^>]*>([\\s\\S]*?)<\\/div>\\s*(?:<div[^>]*id=["']page-|$)`);
  const m=contentHtml.match(r);
  return m?m[1]:null;
}

function markComp(id){
  const n=toggleComp(id);
  toast(n?"Completed!":"Unmarked",n?"success":"info");
  if(n)createConfetti(25);
  showSection(id);
}

function goBack(){
  if(currentId){
    const p=getParent(currentId);
    if(p&&CHAPTER_IDS.includes(p)){showChapter(p);return}
  }
  switchTab(currentTab);
}

// ===== SEARCH =====
function openSearch(){document.getElementById("searchOverlay").classList.add("open");document.getElementById("searchInput").focus();document.getElementById("searchResults").innerHTML=""}
function closeSearch(){document.getElementById("searchOverlay").classList.remove("open")}
function doSearch(q){
  const v=q.toLowerCase().trim();
  const el=document.getElementById("searchResults");
  if(!v){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">Type to search lessons</div>`;return}
  const items=SECTIONS.filter(s=>s.type==="section"&&s.title.toLowerCase().includes(v));
  if(!items.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No results</div>`;return}
  el.innerHTML=items.map(s=>{
    const p=CHAPTERS.find(x=>x.id===s.parent);
    return `<div class="search-item" onclick="closeSearch();showSection('${s.id}')">
      <div class="si-chapter">${p?p.title:""}</div>
      <div class="si-title">${s.title}</div>
    </div>`;
  }).join("");
}

// ===== PROGRESS =====
function showProgress(){
  const ss=SECTIONS.filter(s=>s.type==="section");
  const total=ss.length;
  const done=getComp().length;
  const pct=total?Math.round((done/total)*100):0;
  document.getElementById("content").innerHTML=`
    <div style="text-align:center;padding:16px 0">
      <div style="font-size:42px;font-weight:800;color:var(--cyan)">${pct}%</div>
      <div style="font-size:13px;color:var(--muted)">${done}/${total} lessons</div>
    </div>
    <div class="progress-grid">${CHAPTERS.map(ch=>{
      const p=chPct(ch.id);
      return `<div class="progress-chapter">
        <div class="pc-header"><span class="pc-name"><i class="fas ${ch.icon}" style="color:var(--cyan);margin-right:6px"></i>${ch.title}</span><span class="pc-num">${chCount(ch.id)}/${getSections(ch.id).length}</span></div>
        <div class="pc-bar"><div class="pc-fill" style="width:${p}%"></div></div>
      </div>`;
    }).join("")}</div>`;
}

// ===== THEME =====
function toggleTheme(){
  const h=document.documentElement;
  theme=theme==="dark"?"light":"dark";
  h.setAttribute("data-theme",theme);
  localStorage.setItem("m_theme",theme);
  document.getElementById("btnTheme").innerHTML=theme==="dark"?'<i class="fas fa-moon"></i>':'<i class="fas fa-sun"></i>';
}

// ===== TOAST =====
function toast(msg,type){
  const c=document.getElementById("toastCon");
  const t=document.createElement("div");
  t.className="toast"+(type==="success"?" toast-success":"");
  t.innerHTML=`<i class="fas ${type==="success"?"fa-check-circle":"fa-info-circle"}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(()=>{t.classList.add("removing");setTimeout(()=>t.remove(),250)},2500);
}

// ===== CONFETTI =====
function createConfetti(n){
  const colors=["#FFD93D","#00E5FF","#FF6B9D","#7C3AED"];
  for(let i=0;i<n;i++){
    const e=document.createElement("div");
    e.style.cssText=`position:fixed;left:${Math.random()*100}%;top:-10px;background:${colors[i%4]};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px;border-radius:${Math.random()>.5?"50%":"2px"};z-index:999;pointer-events:none;animation:cf${i%3} ${2+Math.random()*2}s ease-out forwards;animation-delay:${Math.random()*.3}s`;
    const s=document.createElement("style");
    s.textContent=`@keyframes cf${i%3}{to{transform:translateY(100vh) rotate(${360+Math.random()*720}deg);opacity:0}}`;
    document.head.appendChild(s);
    document.body.appendChild(e);
    setTimeout(()=>{e.remove();s.remove()},4000);
  }
}

// ===== ACCORDION =====
function toggleAcc(el){
  const item=el.closest(".acc-item");
  if(!item)return;
  item.classList.toggle("open");
  const b=item.querySelector(".acc-body");
  if(!b)return;
  b.style.maxHeight=item.classList.contains("open")?b.scrollHeight+"px":"0";
}

// ===== FLASHCARDS =====
const fcW=[{b:"be",p:"was/were",pp:"been",d:"يكون"},{b:"begin",p:"began",pp:"begun",d:"يبدا"},{b:"break",p:"broke",pp:"broken",d:"يكسر"},{b:"bring",p:"brought",pp:"brought",d:"يجيب"},{b:"buy",p:"bought",pp:"bought",d:"يشري"},{b:"choose",p:"chose",pp:"chosen",d:"يختار"},{b:"come",p:"came",pp:"come",d:"يجي"},{b:"do",p:"did",pp:"done",d:"يدير"},{b:"drink",p:"drank",pp:"drunk",d:"يشرب"},{b:"drive",p:"drove",pp:"driven",d:"يقود"},{b:"eat",p:"ate",pp:"eaten",d:"ياكل"},{b:"feel",p:"felt",pp:"felt",d:"يحس"},{b:"find",p:"found",pp:"found",d:"يلقى"},{b:"fly",p:"flew",pp:"flown",d:"يطير"},{b:"forget",p:"forgot",pp:"forgotten",d:"ينسى"},{b:"give",p:"gave",pp:"given",d:"يعطي"},{b:"go",p:"went",pp:"gone",d:"يمشي"},{b:"grow",p:"grew",pp:"grown",d:"يكبر"},{b:"know",p:"knew",pp:"known",d:"يعرف"},{b:"make",p:"made",pp:"made",d:"يصنع"}];
let fcI=0,fcF=false;
function showFc(i){
  const w=fcW[i];
  document.getElementById("fcWord")&&(document.getElementById("fcWord").textContent=w.b);
  document.getElementById("fcPast")&&(document.getElementById("fcPast").textContent=w.p);
  document.getElementById("fcPp")&&(document.getElementById("fcPp").textContent=w.pp);
  document.getElementById("fcDz")&&(document.getElementById("fcDz").textContent=w.d);
  document.getElementById("fcCard")&&document.getElementById("fcCard").classList.remove("flipped");
  document.getElementById("fcCount")&&(document.getElementById("fcCount").textContent=(i+1)+"/"+fcW.length);
  fcI=i;fcF=false;
}
function flipFc(){fcF=!fcF;const c=document.getElementById("fcCard");c&&c.classList.toggle("flipped")}
function nextFc(){fcI<fcW.length-1&&showFc(fcI+1)}
function prevFc(){fcI>0&&showFc(fcI-1)}

// ===== QUIZ =====
const qD=[
{q:"What tense uses \"yesterday\"?",o:["Simple Present","Simple Past","Present Perfect","Future"],a:1},
{q:"Passive: \"The book ___ by him.\"",o:["was written","wrote","is writing","has wrote"],a:0},
{q:"Report: \"I am happy\" → He said he ___ happy.",o:["is","was","has been","will be"],a:1},
{q:"Conditional 2: \"If I ___ rich, I would travel.\"",o:["was","were","am","will be"],a:1},
{q:"\"Although\" expresses:",o:["Addition","Contrast","Result","Purpose"],a:1},
{q:"\"Look after\" means:",o:["Search","Take care of","Cancel","Invent"],a:1},
{q:"Gerund: \"I enjoy ___.\"",o:["to swim","swimming","swam","swim"],a:1},
{q:"Modal passive: \"It can ___ easily.\"",o:["be done","done","do","doing"],a:0},
{q:"\"She has lived here ___ 2010.\"",o:["for","since","ago","in"],a:1},
{q:"\"I wish I ___ studied harder.\"",o:["have","had","would","will"],a:1}
];
let qI=0,qSc=0,qAns=false;
function loadQ(){const d=qD[qI];const qEl=document.getElementById("qText");const oEl=document.getElementById("qOpts");const fEl=document.getElementById("qFeed");if(qEl)qEl.textContent=d.q;if(oEl){oEl.innerHTML="";d.o.forEach((o,i)=>{const b=document.createElement("div");b.className="quiz-opt";b.textContent=o;b.onclick=()=>chkQ(i,b);oEl.appendChild(b)})}if(fEl){fEl.style.display="none"}qAns=false}
function chkQ(s,el){if(qAns)return;qAns=true;const d=qD[qI];const os=document.querySelectorAll("#qOpts .quiz-opt");os.forEach((o,i)=>{if(i===d.a)o.classList.add("correct");if(i===s&&s!==d.a)o.classList.add("wrong")});if(s===d.a)qSc++;const f=document.getElementById("qFeed");if(f){f.textContent=s===d.a?"Correct!":"Answer: "+d.o[d.a];f.style.display="block"}}
function nextQ(){if(qI<qD.length-1){qI++;loadQ()}else{const w=document.getElementById("qWrap");if(w)w.innerHTML=`<div class="quiz-score">${qSc}/${qD.length}</div><p style="text-align:center;color:var(--muted);font-size:14px">Great job!</p>`}}
</script>
